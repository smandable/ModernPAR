name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Unit tests (PARKit package)
        timeout-minutes: 20
        # A PTY (script -q) makes test output line-flush — without it the runner block-
        # buffers and a wedged run dies with an empty log, pointing at nothing.
        run: script -q /dev/null swift test --package-path Packages/PARKit

      - name: Lint (swift-format)
        run: swift format lint --strict --recursive App Packages/PARKit/Sources

      # Phase 9: the entitlements file must hold EXACTLY the allowlisted entitlements —
      # no disable-library-validation, no JIT, no get-task-allow, no stray exceptions.
      - name: Entitlements audit (static)
        run: Scripts/entitlements-audit.sh

      - name: Build app (Debug, arm64, unsigned)
        run: |
          xcodebuild -project ModernPAR.xcodeproj -scheme ModernPAR \
            -configuration Debug -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      # Phase 8 exit criterion: no x86_64 slice and no bundled Intel helper anywhere —
      # every Mach-O in the bundle must be arm64-only.
      - name: Verify arm64-only bundle
        run: |
          APP="build/Build/Products/Debug/ModernPAR.app"
          # Guard against path drift: a missing bundle must FAIL, not pass vacuously.
          test -d "$APP" || { echo "app bundle not found at $APP"; exit 1; }
          STATUS=0
          CHECKED=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              ARCHS=$(lipo -archs "$f" 2>/dev/null || true)
              echo "$f: ${ARCHS:-unreadable}"
              if [ "$ARCHS" != "arm64" ]; then STATUS=1; fi
              CHECKED=$((CHECKED+1))
            fi
          done < <(find "$APP" -type f -print0)
          test "$CHECKED" -gt 0 || { echo "no Mach-O files inspected"; exit 1; }
          exit $STATUS

  # Developer-ID signing + notarization runs only on tag pushes (not PRs). Defined in the
  # build/distribution track; see docs/research/06-build-distribution.md.
